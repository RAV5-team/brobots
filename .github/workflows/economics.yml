name: economics

on:
  push:
    branches: [main]
    paths:
      - services/economics/**
      - packages/pycommon/**
      - packages/contracts/openapi/economics.yaml
      - docker-compose.yml
      - infra/postgres/init/**
      - .github/workflows/economics.yml
  pull_request:
    paths:
      - services/economics/**
      - packages/pycommon/**
      - packages/contracts/openapi/economics.yaml
      - docker-compose.yml
      - infra/postgres/init/**
      - .github/workflows/economics.yml

concurrency:
  group: economics-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/economics

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: economics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d economics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/economics
      # As in the Dockerfile: subprocesses of the tests (alembic, python -c) import economic_service.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/economics/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit, API, and PostgreSQL integration tests
        run: pytest -q

  docker:
    needs: [python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/economics/Dockerfile
          target: test
          cache-from: type=gha,scope=economics
          cache-to: type=gha,scope=economics,mode=max
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brobots-economics" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/economics/Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=economics
