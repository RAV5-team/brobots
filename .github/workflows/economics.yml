name: economics

on:
  push:
    branches: [main]
    paths:
      - services/economics/**
      - packages/pycommon/**
      - packages/contracts/openapi/economics.yaml
      - docker-compose.yml
      - infra/postgres/init/**
      - .github/workflows/economics.yml
  pull_request:
    paths:
      - services/economics/**
      - packages/pycommon/**
      - packages/contracts/openapi/economics.yaml
      - docker-compose.yml
      - infra/postgres/init/**
      - .github/workflows/economics.yml

concurrency:
  group: economics-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/economics

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: economics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d economics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/economics
      # As in the Dockerfile: subprocesses of the tests (alembic, python -c) import economic_service.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/economics/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit, API, and PostgreSQL integration tests
        run: pytest -q
