name: api

on:
  push:
    branches: [main]
    paths:
      - services/api/**
      - packages/contracts/openapi/**
      - .github/workflows/api.yml
  pull_request:
    paths:
      - services/api/**
      - packages/contracts/openapi/**
      - .github/workflows/api.yml

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: services/api

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Regenerate OpenAPI contract
        run: go generate ./...
      - name: Contract is up to date
        working-directory: .
        run: git diff --exit-code -- packages/contracts/openapi services/api/internal/apispec

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go test -tags=integration -count=1 -v ./internal/integration/...
