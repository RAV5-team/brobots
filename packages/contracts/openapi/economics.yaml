openapi: 3.1.0
info:
  title: RAV5 Economic Service
  description: Economic calculation service for RAV5 robotics assessments.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Health Check
      description: Reports that the process is alive.
      operationId: health_check_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Check Healthz Get
  /readyz:
    get:
      tags:
      - system
      summary: Readiness Check
      description: 'Reports readiness: the Keycloak keys are loaded, the DB answers.'
      operationId: readiness_check_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readiness Check Readyz Get
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/v1/model-version:
    get:
      tags:
      - evaluations
      summary: Model Version
      description: Returns the calculation and ranking versions served now.
      operationId: model_version_api_v1_model_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionDto'
  /api/v1/evaluations:
    post:
      tags:
      - evaluations
      summary: Create Evaluation
      description: 'Calculates, persists, and returns one evaluation snapshot.


        dry_run calculates without saving: the guest preview of a demo project

        keeps nothing (roles model §5).'
      operationId: create_evaluation_api_v1_evaluations_post
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequestDto-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSnapshotDto'
        '409':
          description: The requested model version is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422':
          description: The request is invalid or contains invalid domain data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/v1/evaluations/{evaluation_id}:
    get:
      tags:
      - evaluations
      summary: Get Evaluation
      description: Returns the latest immutable snapshot for an evaluation.
      operationId: get_evaluation_api_v1_evaluations__evaluation_id__get
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSnapshotDto'
        '404':
          description: The evaluation was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
