openapi: 3.0.3
info:
  description: |-
    Контракт калькуляции, который вызывает оркестратор сервиса api (docs/orchestrator.md).

    Запрос — замороженный вход расчёта одного проекта: локация, задача и кандидаты подбора с полями каталога. Ответ — ровно один результат на кандидата и модель приобретения из acquisitionModels запроса, которую предлагает робот (пустой acquisitionModels кандидата — все модели). modelVersion обязателен: проект хранит его, чтобы старые расчёты воспроизводились после смены формул. У каждого числа — строка trace с формулой и источником. Деньги — рубли с НДС, доли — от 0 до 1.

    Пока сервиса нет, api считает встроенной мок-моделью mock-calc/v1 (ECONOMICS_URL пуст).
  title: RAV5 Economics · расчёт парка и экономики
  version: 0.1.0
paths:
  /api/v1/calculations:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
      summary: Рассчитать кандидатов проекта
      tags:
      - economics
  /api/v1/model-version:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionResponse'
          description: OK
      summary: Версия ядра расчёта
      tags:
      - economics
