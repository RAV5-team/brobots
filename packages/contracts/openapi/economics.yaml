          - type: 'null'
        payload_kg:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Payload Kg
        max_speed_mps:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Max Speed Mps
        loading_seconds:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Loading Seconds
        unloading_seconds:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Unloading Seconds
        average_power_kw:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Average Power Kw
        handling_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Handling Method
        catalog_status:
          type: string
          title: Catalog Status
        confirmation:
          $ref: '#/components/schemas/ConfirmationStatus'
        source:
          $ref: '#/components/schemas/SourceDto'
        acquisition_models:
          items:
            $ref: '#/components/schemas/AcquisitionModel'
          type: array
          minItems: 1
          title: Acquisition Models
        throughput_per_hour:
          anyOf:
          - $ref: '#/components/schemas/SourcedValueDto-Input'
          - type: 'null'
        maturity_trl:
          anyOf:
          - $ref: '#/components/schemas/SourcedValueDto-Input'
          - type: 'null'
        catalog_completeness_percent:
          anyOf:
          - $ref: '#/components/schemas/SourcedValueDto-Input'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - candidate_id
      - robot_code
      - price
      - payload_kg
      - max_speed_mps
      - loading_seconds
      - unloading_seconds
      - average_power_kw
      - handling_method
      - catalog_status
      - confirmation
      - source
      - acquisition_models
