workTypes:
  - code: OP-01
    name: Перемещение грузов
    description: Паллеты, тележки и короба между зонами объекта
    unitLabel: ед. груза
    workCategoryCode: internal_logistics
    typicalCarriers: паллета, тележка, багажная тележка, короб
    exampleProcesses: Перемещение паллет; Перемещение багажа
  - code: OP-02
    name: Комплектация заказов
    description: Отбор товара по строкам заказа
    unitLabel: строк
    workCategoryCode: fulfillment
    typicalCarriers: мобильный стеллаж, короб
    exampleProcesses: Комплектация заказов
  - code: OP-03
    name: Сортировка
    description: Распределение отправлений по направлениям
    unitLabel: отправлений
    workCategoryCode: fulfillment
    typicalCarriers: отправление, посылка
    exampleProcesses: Сортировка грузов
  - code: OP-04
    name: Хранение и выдача
    description: Автоматические склады, шаттлы, стеллажи, подъём на ярус
    unitLabel: операций
    workCategoryCode: internal_logistics
    typicalCarriers: паллета, контейнер
    exampleProcesses: Подъём паллет на ярус
  - code: OP-05
    name: Упаковка и паллетирование
    description: Упаковочные линии и паллетайзеры
    unitLabel: заказов
    workCategoryCode: fulfillment
    typicalCarriers: заказ, короб
    exampleProcesses: Упаковка
  - code: OP-06
    name: Инвентаризация
    description: Пересчёт и контроль мест хранения
    unitLabel: паллетомест
    workCategoryCode: accounting_control
    typicalCarriers: паллетоместо
    exampleProcesses: Инвентаризация
  - code: OP-07
    name: Уборка помещений
    description: Сухая и влажная уборка твёрдых покрытий
    unitLabel: м²
    workCategoryCode: facility_maintenance
    typicalCarriers: твёрдое покрытие
    exampleProcesses: Уборка помещений; Уборка терминала
  - code: OP-08
    name: Адресная доставка
    description: Доставка по точкам маршрута внутри объекта
    unitLabel: рейсов
    workCategoryCode: internal_logistics
    typicalCarriers: тележка с питанием, контейнер с бельём, контейнер с пробами
    exampleProcesses: Доставка питания по отделениям; Транспорт белья; Доставка биоматериалов; Доставка бортпитания
  - code: OP-09
    name: Охрана и патрулирование
    description: Обходы по маршруту, видеоаналитика
    unitLabel: обходов
    workCategoryCode: security
    typicalCarriers: маршрут обхода
    exampleProcesses: Патрулирование и охрана
  - code: OP-10
    name: Мониторинг и инспекция
    description: Осмотр и контроль состояния
    unitLabel: обходов
    workCategoryCode: accounting_control
    typicalCarriers: объект осмотра
    exampleProcesses: Инспекция оборудования

