components:
  schemas:
    AssumptionValue:
      properties:
        code:
          type: string
        label:
          type: string
        unit:
          type: string
        value:
          format: double
          type: number
      type: object
    AuthError:
      properties:
        code:
          enum:
          - unauthorized
          - forbidden
          type: string
        message:
          description: Что случилось и как исправить, на русском
          type: string
      type: object
    Badges:
      properties:
        inRegistry719:
          type: boolean
        testedByFcbas:
          type: boolean
      type: object
    Budget:
      properties:
        amount:
          nullable: true
          type: number
        currency:
          type: string
        source:
          nullable: true
          type: string
        sourceUnit:
          nullable: true
          type: string
      type: object
    CalcResult:
      properties:
        acquisitionModel:
          enum:
          - purchase
          - raas
          type: string
        budgetOverPct:
          description: Превышение бюджета, доля 0–1
          nullable: true
          type: number
        budgetOverRub:
          description: Превышение бюджета CAPEX; 0 — в бюджете, null — бюджет не задан
          nullable: true
          type: number
        calculable:
          description: false — не хватает данных, причина в reason
          type: boolean
        capexRub:
          description: Первоначальные затраты; для RaaS — запуск без аренды
          nullable: true
          type: number
        chargerCount:
          nullable: true
          type: integer
        details:
