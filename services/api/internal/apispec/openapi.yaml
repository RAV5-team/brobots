openapi: 3.0.3
info:
  description: |-
    Сервис api: локации, задачи и проекты; каталог и классы операций; подбор по классу операции и жёсткие проверки.

    Ошибки — application/problem+json (RFC 7807) с полем errors: поле, код, сообщение и подсказка на русском.
    Доступ — access token Keycloak (realm rav5, aud rav5-api) в заголовке Authorization: Bearer. Чтение открыто гостю; присланный токен обязан быть валидным. Запись — вошедшему пользователю, каталог, классы операций, источники и справочные процессы — роли admin. Локации, задачи, проекты и пользовательские процессы принадлежат автору: пользователь видит свои и демо-данные, гость — только демо; чужие — 404, изменение демо-данных и справочных процессов без admin — 403. 401 и 403 — {code, message}; сервисный токен на этих путях — 403.
    PATCH — JSON merge patch: переданные поля заменяются, null очищает, вложенные объекты сливаются; неизвестные поля отклоняются.
    Доли (automationShare, timeShare и т.п.) — от 0 до 1. Деньги — рубли с НДС.
  title: RAV5 API · локации, каталог, подбор
  version: 0.1.0
