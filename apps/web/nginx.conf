# Раздача собранного фронтенда и прокси в api.
# Фронт и API живут на одном origin, поэтому CORS не нужен вовсе.

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Проверка живости самого контейнера с фронтендом.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        # Прогон симуляции идёт десятки секунд — короткий таймаут его срежет.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Хэш в имени файла => содержимое неизменяемо.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаёт index.html, роутинг разбирает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
