# Общий server-уровень обоих профилей: буферы и location Keycloak. Подключается внутри server;
# шаблонами не обрабатывается — переменных окружения здесь нет. Location админки с
# ${ADMIN_ALLOW_CIDR} — в шаблонах профилей.

# Keycloak ставит большие cookie и заголовки: без этих буферов — 502 "upstream sent too big header".
large_client_header_buffers 4 32k;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# `proxy_pass http://kc;` без URI передаёт путь как есть (/auth/... — это нужно Keycloak).
# Свои X-Frame-Options и CSP Keycloak ставит сам.

location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

# Dynamic Client Registration снаружи закрыт.
location ^~ /auth/realms/rav5/clients-registrations/ { return 404; }

location ^~ /auth/realms/rav5/protocol/openid-connect/token {
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/snippets/proxy-headers.conf;
    add_header Strict-Transport-Security $hsts always;
    proxy_pass http://kc;
}
location ^~ /auth/realms/rav5/login-actions/ {
    limit_req zone=auth burst=30 nodelay;
    include /etc/nginx/snippets/proxy-headers.conf;
    add_header Strict-Transport-Security $hsts always;
    proxy_pass http://kc;
}
location /auth/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    add_header Strict-Transport-Security $hsts always;
    proxy_pass http://kc;
}
