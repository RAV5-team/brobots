# Общий http-уровень обоих профилей. Подключается из шаблона профиля; шаблонами не
# обрабатывается — переменных окружения здесь нет.

server_tokens off;

# Встроенный DNS Docker. Вместе с `resolve` в upstream nginx стартует, даже если Keycloak
# ещё не поднят, и подхватывает новый IP после перезапуска контейнера.
resolver 127.0.0.11 valid=10s ipv6=off;

map $scheme $hsts { https "max-age=31536000"; default ""; }

# Вход и выдача токенов: 30 запросов в минуту с IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

upstream kc { zone kc 64k; server keycloak:8080 resolve; }
