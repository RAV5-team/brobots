# Базовый контур: 3 сервиса + фронтенд + Postgres.
#
#   cp .env.example .env
#   docker compose up --build          # разработка (подхватится docker-compose.override.yml)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Порт фронтенда объявлен только в override/prod: в разработке это Vite на 5173,
# в проде — nginx на 80. Остальные порты одинаковы в обоих режимах.

name: brobots

x-service: &service
  restart: unless-stopped
  networks: [brobots]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?переменная не задана, скопируйте .env.example в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?переменная не задана, скопируйте .env.example в .env}
      POSTGRES_DB: ${POSTGRES_DB:-brobots}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Скрипты отсюда выполняются один раз — при создании пустого тома.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  economics:
    <<: *service
    build:
      context: .
      dockerfile: services/economics/Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8002
    ports:
      - "${ECONOMICS_PORT:-8002}:8002"

  simulation:
    <<: *service
    build:
      context: .
      dockerfile: services/simulation/Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8001
    ports:
      - "${SIMULATION_PORT:-8001}:8001"

  api:
    <<: *service
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brobots}?sslmode=disable
      # Миграции goose при старте; демо-данные организатора загружаются один раз и не перезаписываются.
      MIGRATE_ON_START: ${API_MIGRATE_ON_START:-true}
      SEED_DEMO: ${API_SEED_DEMO:-true}
      SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-true}
      SIMULATION_URL: http://simulation:8001
      ECONOMICS_URL: http://economics:8002
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      simulation:
        condition: service_started
      economics:
        condition: service_started

  web:
    <<: *service
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        # Пусто = относительные пути, nginx внутри контейнера проксирует /api в api.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - api

volumes:
  postgres-data:

networks:
  brobots:
    driver: bridge
