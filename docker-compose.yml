# Контур RAV5: Postgres + Keycloak + nginx-шлюз на /auth + сервисы api и simulation.
#
#   cp .env.example .env && docker compose up -d --build            # профиль local, http://localhost
#   docker compose -f docker-compose.yml -f docker-compose.stand.yml up -d --build   # stand, https
#
# Postgres — одна инстанция, у каждого потребителя своя роль и БД (keycloak, api, simulation);
# их создают скрипты infra/postgres/init при первом запуске на пустом томе.
# Наружу публикуются шлюз, api (API_PORT) и simulation (SIMULATION_PORT).
# economics и web пока каркасы без кода — в контур не входят.

name: rav5

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-simulation-build: &simulation-build
  context: .
  dockerfile: services/simulation/Dockerfile
  target: runtime

networks:
  edge: {}
  # Без выхода в интернет: здесь живёт Postgres.
  internal:
    internal: true

volumes:
  pgdata: {}

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?переменная не задана, скопируйте .env.example в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?переменная не задана, скопируйте .env.example в .env}
      # Роли и БД создают infra/postgres/init/*.sh (только на пустом томе).
      KC_DB_USERNAME: ${KC_DB_USERNAME:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      API_DB_USERNAME: ${API_DB_USERNAME:?}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      SIM_DB_USERNAME: ${SIM_DB_USERNAME:?}
      SIM_DB_PASSWORD: ${SIM_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    <<: *service
    build: ./infra/keycloak
    # Схему своей БД Keycloak создаёт и обновляет сам (миграции Liquibase при старте).
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_URL:?переменная не задана, скопируйте .env.example в .env}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Подставляются в realm-rav5.json при импорте.
      PUBLIC_URL: ${PUBLIC_URL}
      KC_API_INTERNAL_SECRET: ${KC_API_INTERNAL_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/realm-rav5.json:/opt/keycloak/data/import/realm-rav5.json:ro
    # edge — для шлюза и для клиентов Keycloak внутри Docker (http://keycloak:8080/auth).
    networks: [edge, internal]
    mem_limit: 1g
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # В образе нет curl: запрос к management-порту 9000 средствами bash.
      # Проверяется статус ответа (200/503), а не `grep UP`: тело DOWN-ответа тоже содержит
      # "UP" (проверка "Graceful Shutdown"), и контейнер стал бы healthy до готовности.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      # Холодный старт с импортом realm — 1–2 минуты, на загруженной машине дольше.
      # Сбои во время start_period не считаются; дальше до unhealthy ещё 30 × 10 с.
      retries: 30
      start_period: 180s

  gateway:
    <<: *service
    image: nginx:1.28-alpine
    ports: ["${GATEWAY_PORT:-80}:80"]
    environment:
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-0.0.0.0/0}
    volumes:
      - ./infra/nginx/templates/gateway.local.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    networks: [edge]
    mem_limit: 128m
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *service
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8000"
      DATABASE_URL: postgres://${API_DB_USERNAME}:${API_DB_PASSWORD}@postgres:5432/api?sslmode=disable
      # Миграции goose при старте; демо-данные организатора загружаются один раз и не перезаписываются.
      MIGRATE_ON_START: ${API_MIGRATE_ON_START:-true}
      SEED_DEMO: ${API_SEED_DEMO:-true}
      SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-true}
      SIMULATION_URL: http://simulation:8765
      # Проверка токенов Keycloak (docs/keycloak/middleware.md): iss публичный, JWKS — внутренний.
      OIDC_ISSUER: ${PUBLIC_URL:?}/auth/realms/rav5
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/rav5/protocol/openid-connect/certs
      OIDC_AUDIENCE: rav5-api
      # TODO(dev-auth): dev-режим для ручного тестирования — запросы без токена идут от AUTH_DEV_SUB;
      # только при APP_ENV=local. Удалить вместе с dev-режимом.
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      AUTH_DEV_SUB: ${AUTH_DEV_SUB:-}
      AUTH_DEV_ROLES: ${AUTH_DEV_ROLES:-}
    ports: ["${API_PORT:-8000}:8000"]
    # edge — для публикации порта и вызовов simulation, internal — для Postgres.
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }

  # Разовый шаг: схема БД simulation. Сервер миграции не применяет и без нужной
  # ревизии схемы не стартует (код выхода 3).
  simulation-migrate:
    <<: *service
    build: *simulation-build
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${SIM_DB_USERNAME}:${SIM_DB_PASSWORD}@postgres:5432/simulation
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  simulation:
    <<: *service
    build: *simulation-build
    environment:
      DATABASE_URL: postgresql://${SIM_DB_USERNAME}:${SIM_DB_PASSWORD}@postgres:5432/simulation
      PORT: 8765
      # Воркеры заданий в процессе сервера; 0 — только API (воркеры отдельно: python -m app.worker).
      SIM_WORKERS: ${SIM_WORKERS:-1}
      # Проверка токенов Keycloak (docs/keycloak/middleware.md): до загрузки ключей /api/health — 503.
      OIDC_ISSUER: ${PUBLIC_URL:?}/auth/realms/rav5
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/rav5/protocol/openid-connect/certs
      OIDC_AUDIENCE: rav5-sim
      INTERNAL_CALLER_AZP: rav5-api-internal
      APP_ENV: ${APP_ENV:-local}
      # TODO(dev-auth): dev-режим для ручного тестирования — запросы без токена идут от AUTH_DEV_SUB;
      # только при APP_ENV=local. Удалить вместе с dev-режимом.
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      AUTH_DEV_SUB: ${AUTH_DEV_SUB:-}
      AUTH_DEV_ROLES: ${AUTH_DEV_ROLES:-}
    ports: ["${SIMULATION_PORT:-8765}:8765"]
    networks: [edge, internal]
    depends_on:
      simulation-migrate: { condition: service_completed_successfully }
