# Режим разработки. Подхватывается автоматически при `docker compose up`.
#
# Отличия от базового файла: код монтируется внутрь контейнера, процессы
# перезапускаются на изменение файлов, сборка останавливается на стадии с
# тулчейном (target: source) — компилятор и dev-зависимости остаются в образе.

services:
  economics:
    build:
      target: source
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8002
      - --reload
    volumes:
      - ./services/economics:/app
      - ./packages/pycommon:/opt/pycommon:ro

  simulation:
    build:
      target: source
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8001
      - --reload
    volumes:
      - ./services/simulation:/app
      - ./packages/pycommon:/opt/pycommon:ro

  api:
    build:
      target: source
    # go run пересобирает бинарь на каждый перезапуск контейнера.
    # Живая перезагрузка по сохранению файла — это air, ставится отдельно.
    command: ["go", "run", "./cmd/api"]
    volumes:
      - ./services/api:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  web:
    build:
      target: source
    command: ["npm", "run", "dev", "--", "--host=0.0.0.0", "--port=5173"]
    environment:
      # В dev Vite сам проксирует /api в api — см. server.proxy в vite.config.ts.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      # Именованный том: node_modules из образа не затираются монтированием кода.
      - web-node-modules:/app/node_modules

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
